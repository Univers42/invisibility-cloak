name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n + shellcheck, every shell script
        run: |
          mapfile -t files < <(git ls-files | while read -r f; do head -n1 "$f" | grep -qE '^#!.*bash' && echo "$f"; done)
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x -S style "${files[@]}"

  # The kernel side: every global-mode and jail rule, checked by nft without loading anything.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q nftables
      - run: sudo bin/hide check-rules

  # The package names on each family, with the obfs4 bridge program.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:stable, ubuntu:24.04, fedora:latest, archlinux:latest, opensuse/tumbleweed]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: refresh Arch first (setup.sh asks you to)
        if: startsWith(matrix.image, 'archlinux')
        run: pacman -Syu --noconfirm
      - run: bash ./setup.sh deps --bridges obfs4
      - name: every program hide uses is there
        run: |
          for c in tor nft curl nc python3 ip ss nsenter setpriv sysctl pkill; do command -v "$c"; done
          command -v proxychains4 || command -v proxychains
          command -v lyrebird || command -v obfs4proxy

  # A real install on a systemd VM, global mode off (on would cut the runner off from GitHub).
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./setup.sh check
      - run: sudo ./setup.sh install --global off
      - name: wait for Tor
        run: |
          for _ in $(seq 60); do
            if curl -s --max-time 20 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '"IsTor":true'; then exit 0; fi
            sleep 5
          done
          sudo journalctl -u ip-changer -n 40 --no-pager
          exit 1
      - run: hide-test
      - run: hide status
      - run: sudo ./setup.sh uninstall
