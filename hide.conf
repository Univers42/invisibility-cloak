# hide.conf — one file drives the setup on every device (setup.sh copies it to
# /etc/hide/hide.conf once; edit that copy, or use the hide commands named below).

# on  = every app, user and container reaches the internet only through Tor;
#       anything Tor can't carry (UDP, ICMP, IPv6) is blocked. Fail-closed.
# off = proxy-aware apps, the apps in APPS and `hide run …` go through Tor; the rest is direct.
# setup.sh asks on a first install (or: --global on|off). Change it with: hide global on|off
GLOBAL=off

# Seconds between new Tor exits (ip-changer NEWNYM; minimum 5).
ROTATE=30

# Apps that always start inside the Tor jail, by launcher name (see `hide add`),
# e.g. APPS="discord slack". setup.sh asks when this is empty.
APPS=""

# Network blocks Tor (some countries, offices, schools)? Reach it through bridges:
#   snowflake = looks like a video call (needs snowflake-client),
#   obfs4     = looks like random noise (needs lyrebird or obfs4proxy),
#   or the path to a file of your own bridge lines from https://bridges.torproject.org.
# Empty = connect to Tor directly. Change it with: hide bridges snowflake|obfs4|FILE|off
BRIDGES=""

# The fast lane: what skips Tor, for speed and UDP (video, calls, games). It reaches the
# internet directly, so those sites and apps see your real IP. Change it with hide fast.
#   FAST_SITES: youtube, twitch, or domains, e.g. FAST_SITES="youtube example.org". Browsers
#               set up by global-proxy send them direct; every other site still uses Tor.
#   FAST_APPS:  on = apps started with `hide fast run` (or a launcher from `hide fast add
#               <app>`) go direct, with UDP. While on, any program of yours could do the same.
FAST_SITES=""
FAST_APPS=off
