# hide.conf — one file drives the setup on every device (setup.sh copies it to
# /etc/hide/hide.conf once; edit that copy, or use `hide global on|off`).

# on  = every app, user and container reaches the internet only through Tor;
#       anything Tor can't carry (UDP, ICMP, IPv6) is blocked. Fail-closed.
# off = only the apps listed in APPS (and `hide run …`) go through Tor.
GLOBAL=on

# Seconds between new Tor exits (ip-changer NEWNYM; minimum 5).
ROTATE=30

# Apps that always start inside the Tor jail, by launcher name (see `hide add`),
# e.g. APPS="discord slack". setup.sh asks when this is empty.
APPS=""

# Network blocks Tor (some countries, offices, schools)? Reach it through bridges:
#   snowflake = looks like a video call (needs snowflake-client),
#   obfs4     = looks like random noise (needs lyrebird or obfs4proxy),
#   or the path to a file of your own bridge lines from https://bridges.torproject.org.
# Empty = connect to Tor directly. Change it with: hide bridges snowflake|obfs4|FILE|off
BRIDGES=""
